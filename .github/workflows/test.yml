name: Run Tests

on:
  push:
    branches: [ dev, feature/managers, feature/commands, feature/util, feature/threadsafe-managers, feature/parallel-logs, feature/workers, feature/schedule-tasks, feature/load-test, feature/async-audit ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run tests with Maven
        run: mvn test